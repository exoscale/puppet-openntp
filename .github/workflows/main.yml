name: build-and-test
on: [push]
jobs:
  unit-tests:
    name: "Puppet ${{ matrix.puppet-version }} Unit Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ruby-version: 2.7
            puppet-version: 6
          - ruby-version: 3.1
            puppet-version: 7
          - ruby-version: 3.1
            puppet-version: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{matrix.ruby-version}}
      - run: bundle install
        env:
          PUPPET_VERSION: "~> ${{ matrix.puppet-version }}"
      - run: bundle exec rake test
        env:
          PUPPET_VERSION: "~> ${{ matrix.puppet-version }}"
          SPEC_OPTS: '--format documentation'
          RUBYOPT: "-W0"

  acceptance-tests:
    name: "${{ matrix.label }} Acceptance Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - beaker-set: debian-9-64
            label: "Debian 9"
          - beaker-set: default
            label: "Debian 10"
          - beaker-set: ubuntu-1804-64
            label: "Ubuntu 18.04"
          - beaker-set: ubuntu-2004-64
            label: "Ubuntu 20.04"
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      - run: bundle install
      - run: bundle exec rake beaker
